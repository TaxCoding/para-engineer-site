<body class="shell-public">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <!-- Sidebar kiri: HANYA aktif di /admin/* -->
  <aside class="left-sidebar" id="leftSidebar" aria-label="Admin navigation"></aside>

  <!-- Laci / Inventory kanan atas: kucing + kontak -->
  <div class="inventory-drawer" id="inventoryDrawer" aria-hidden="true"></div>

  <!-- Kerangka utama halaman -->
  <div class="app-shell">
    <header class="top-header" id="topHeader">
      <div class="header-inner">
        <div class="header-left">
          <button type="button" class="icon-btn admin-only-btn" id="openSidebarBtn" title="Toggle sidebar" aria-label="Toggle sidebar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
          </button>
          <a href="/" class="brand" id="brandLink" aria-label="Para Engineer Home">
            <svg class="cat-logo" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M14 24C12 16 18 12 23 16C26 14 38 14 41 16C46 12 52 16 50 24C54 30 54 42 46 48C40 52 24 52 18 48C10 42 10 30 14 24Z" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round"/>
              <circle cx="24" cy="31" r="2.8" fill="currentColor"/>
              <circle cx="40" cy="31" r="2.8" fill="currentColor"/>
              <path d="M29 36.5H35L32 40L29 36.5Z" fill="#2563EB"/>
              <path d="M27 42C29 44 31 43 32 41.5C33 43 35 44 37 42" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
              <path d="M30.5 43C30.5 45.5 33.5 45.5 33.5 43" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
              <path d="M8 33L16 35M8 39L16 38M56 33L48 35M56 39L48 38" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
            </svg>
            <span id="brandName">Para Engineer</span>
          </a>
        </div>

        <!-- Navigasi publik (selalu tampil di desktop) -->
        <nav class="top-nav" id="topNav" aria-label="Primary navigation"></nav>

        <div class="header-right">
          <span id="headerCtaSlot"></span>
          <button type="button" class="icon-btn mobile-menu-btn" id="mobileNavBtn" aria-label="Menu" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
          </button>
          <button type="button" class="hamburger-btn" id="inventoryBtn" aria-label="Toggle cats and contact drawer" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
          </button>
        </div>
      </div>

      <!-- Menu dropdown ringan khusus layar HP -->
      <nav class="mobile-nav-drawer" id="mobileNavDrawer" aria-label="Mobile navigation"></nav>
    </header>

    <main class="main-stage" id="view"></main>
  </div>

  <div class="toast-warning" id="toastWarning" role="alert" aria-live="polite"></div>
  <div id="modalRoot"></div>

  <noscript>
    <p style="padding:2rem;text-align:center;font-family:system-ui">Para Engineer needs JavaScript to run.</p>
  </noscript>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
